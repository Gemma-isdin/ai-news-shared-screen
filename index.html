<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISDIN | AI News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Tokens del ISDIN Backoffice Design System ("Clinical Luxury")
   ========================================================= */
:root, [data-theme="light"] {
  --isdin-gold: hsl(38 92% 50%);
  --isdin-gold-soft: hsl(40 85% 96%);
  --isdin-navy: hsl(220 45% 20%);
  --isdin-navy-deep: hsl(222 50% 12%);
  --isdin-navy-soft: hsl(220 30% 96%);
  --primary: hsl(12 76% 61%);
  --primary-soft: hsl(12 100% 97%);
  --background: hsl(40 20% 99%);
  --foreground: hsl(220 25% 12%);
  --card: hsl(0 0% 100%);
  --muted: hsl(40 15% 96%);
  --muted-foreground: hsl(220 10% 46%);
  --warning-soft: hsl(38 100% 95%);
  --border: hsl(220 15% 91%);
  --shadow-elevated: 0 2px 4px hsl(220 30% 15% / 0.04), 0 4px 8px hsl(220 30% 15% / 0.04), 0 8px 16px hsl(220 30% 15% / 0.02);
  --shadow-elevated-lg: 0 4px 8px hsl(220 30% 15% / 0.06), 0 8px 16px hsl(220 30% 15% / 0.06), 0 24px 48px hsl(220 30% 15% / 0.08);
  --radius: 0.625rem;
  --radius-lg: 1rem;
  --radius-xl: 1.5rem;
  --font-sans: "DM Sans", system-ui, sans-serif;
  --font-display: "Plus Jakarta Sans", system-ui, sans-serif;
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: light;
}
[data-theme="dark"] {
  --background: hsl(220 25% 8%); --foreground: hsl(40 15% 95%); --card: hsl(220 25% 11%);
  --muted: hsl(220 20% 15%); --muted-foreground: hsl(220 10% 60%); --border: hsl(220 20% 18%);
  --primary-soft: hsl(12 50% 15%); --isdin-navy-soft: hsl(220 25% 14%); --isdin-gold-soft: hsl(220 25% 11%);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: hsl(220 25% 8%); --foreground: hsl(40 15% 95%); --card: hsl(220 25% 11%);
    --muted: hsl(220 20% 15%); --muted-foreground: hsl(220 10% 60%); --border: hsl(220 20% 18%);
    --primary-soft: hsl(12 50% 15%); --isdin-navy-soft: hsl(220 25% 14%); --isdin-gold-soft: hsl(220 25% 11%);
    color-scheme: dark;
  }
}
:root {
  font-size: min(1.48vw, 0.833vh);   /* 16px en 1080x1920 */
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background:
    radial-gradient(60rem 40rem at 110% -5%, hsl(12 76% 61% / .08), transparent 70%),
    radial-gradient(50rem 40rem at -10% 60%, hsl(220 45% 20% / .06), transparent 70%),
    var(--background);
  color: var(--foreground);
  font-family: var(--font-sans); line-height: 1.6;
  font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  -webkit-font-smoothing: antialiased; cursor: none;
}
h1, h2 { font-family: var(--font-display); letter-spacing: -0.02em; line-height: 1.15; }

.pantalla {
  height: 100%;
  display: grid;
  grid-template-rows: 7rem minmax(0, 60fr) 6.2rem minmax(0, 27fr) 12rem 4.4rem;
  gap: 1.25rem;
}
.marco { padding: 0 2.5rem; min-height: 0; }
.tarjeta {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-elevated);
  overflow: hidden; height: 100%;
}

/* ---------- Cabecera ---------- */
.cabecera {
  display: flex; align-items: center; justify-content: space-between; padding: 0 2.5rem;
  background: color-mix(in srgb, var(--card) 80%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.marca { display: flex; align-items: center; gap: 1.6rem; }
.marca img { height: 4rem; width: auto; display: block; }
.marca-sep { width: 1px; height: 3.2rem; background: var(--border); }
.marca-nombre { font-family: var(--font-display); font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
.marca-sub { font-size: 1rem; color: var(--muted-foreground); }
.derecha { display: flex; align-items: center; gap: 1.6rem; }
.directo {
  display: flex; align-items: center; gap: 0.6rem; font-size: 1rem; font-weight: 600;
  color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, transparent);
  padding: 0.35rem 0.9rem; border-radius: 2rem;
}
.directo i { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--primary); position: relative; }
.directo i::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--primary);
  animation: latido 1.6s var(--ease-out-expo) infinite;
}
@keyframes latido { from { transform: scale(1); opacity: .7; } to { transform: scale(3); opacity: 0; } }
.reloj { text-align: right; }
.reloj-hora { font-family: var(--font-display); font-size: 2.3rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.reloj-fecha { font-size: 1rem; color: var(--muted-foreground); }

/* ---------- Escenario principal ---------- */
.escenario {
  position: relative; height: 100%; border-radius: var(--radius-xl); overflow: hidden;
  background: var(--isdin-navy-deep); box-shadow: var(--shadow-elevated-lg); color: #fff;
}
.fondo { position: absolute; inset: 0; }
.capa {
  position: absolute; inset: 0; clip-path: inset(0 0 0 100%);
  transition: clip-path 1.1s var(--ease-out-expo);
}
.capa.dentro { clip-path: inset(0 0 0 0); }
.capa img, .collage img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  animation: acercar 22s linear forwards;
}
@keyframes acercar { from { transform: scale(1.02); } to { transform: scale(1.12); } }
.collage { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 3px; }
.collage > div { position: relative; overflow: hidden; }
.velo {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(180deg, hsl(222 50% 12% / .55) 0%, transparent 18%),
    linear-gradient(0deg, hsl(222 50% 12% / .97) 0%, hsl(222 50% 12% / .88) 34%, hsl(222 50% 12% / .35) 62%, transparent 82%);
}

/* Fondo de marca para noticias sin imagen */
.malla { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(140deg, hsl(220 45% 24%), var(--isdin-navy-deep)); }
.malla .mancha { position: absolute; aspect-ratio: 1; border-radius: 50%; filter: blur(4rem); }
.malla span {
  position: absolute; left: 3rem; top: 6rem; font-family: var(--font-display); font-size: 9rem; font-weight: 800;
  letter-spacing: -0.04em; line-height: 1; color: #fff; opacity: .07; white-space: nowrap;
}
.malla.clara { background: linear-gradient(135deg, var(--background), var(--isdin-navy-soft) 50%, var(--isdin-gold-soft)); }
.malla.clara .mancha { filter: blur(1.2rem); }

/* Historias: una barra por diapositiva */
.historias { position: absolute; left: 2.5rem; right: 2.5rem; top: 2rem; display: flex; gap: 0.4rem; z-index: 3; }
.historias i { flex: 1; height: 0.28rem; border-radius: 1rem; background: hsl(0 0% 100% / .28); overflow: hidden; }
.historias i.hecha { background: hsl(0 0% 100% / .9); }
.historias i b { display: block; height: 100%; width: 0; background: #fff; border-radius: 1rem; }

.etiqueta-sup {
  position: absolute; left: 2.5rem; top: 3.4rem; z-index: 3;
  display: flex; align-items: center; gap: 0.7rem; font-size: 1.1rem; font-weight: 600;
}
.etiqueta-sup .chip {
  padding: 0.3rem 0.85rem; border-radius: var(--radius);
  background: hsl(0 0% 100% / .14); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.etiqueta-sup .chip.nuevo { background: var(--primary); }
.etiqueta-sup .chip.aviso { background: var(--isdin-gold); color: var(--isdin-navy-deep); }

/* Escáner "IA analizando" */
.escaner { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .3s ease; }
.escaner.activo { opacity: 1; }
.escaner .linea {
  position: absolute; left: 0; right: 0; height: 9rem; top: -9rem;
  background: linear-gradient(180deg, transparent, hsl(12 76% 61% / .16) 70%, hsl(12 76% 61% / .55) 98%, hsl(12 90% 75%) 100%);
}
.escaner.activo .linea { animation: barrido 1.6s cubic-bezier(.45,.05,.35,1) forwards; }
@keyframes barrido { to { top: 100%; } }
.escaner .rejilla {
  position: absolute; inset: 0; opacity: .25;
  background-image: linear-gradient(hsl(0 0% 100% / .12) 1px, transparent 1px), linear-gradient(90deg, hsl(0 0% 100% / .12) 1px, transparent 1px);
  background-size: 3rem 3rem;
}

.contenido {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
  padding: 0 2.5rem 2.2rem; display: grid; grid-template-columns: 1fr auto; gap: 2rem; align-items: end;
}
.contenido.ocultar .titulo, .contenido.ocultar .resumen, .contenido.ocultar .pie { opacity: 0; transition: opacity .3s ease; }
.estado {
  display: inline-flex; align-items: center; gap: 0.6rem; font-size: 1.05rem; font-weight: 500;
  color: hsl(220 30% 85%); margin-bottom: 1rem; min-height: 1.6rem;
}
.estado .punto { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--primary); }
.titulo { font-size: 3.7rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; }
.palabra { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.1em; margin-bottom: -0.1em; }
.palabra > span { display: inline-block; transform: translateY(110%); transition: transform .8s var(--ease-out-expo); }
.titulo.visible .palabra > span { transform: none; }
.resumen {
  font-size: 1.6rem; line-height: 1.55; margin-top: 1.2rem; color: hsl(220 30% 90%);
  max-width: 58ch; min-height: 4.65em;
}
.resumen .caret {
  display: inline-block; width: 0.1em; height: 1.05em; background: var(--primary);
  vertical-align: -0.15em; margin-left: 0.06em; border-radius: 1px;
}
.esqueleto { display: grid; gap: 0.75rem; padding-top: 0.35rem; }
.esqueleto i {
  display: block; height: 1.25rem; border-radius: var(--radius);
  background: linear-gradient(90deg, hsl(0 0% 100% / .08) 0%, hsl(0 0% 100% / .22) 50%, hsl(0 0% 100% / .08) 100%);
  background-size: 200% 100%; animation: shimmer 1.2s infinite;
}
.esqueleto i:nth-child(2) { width: 90%; } .esqueleto i:nth-child(3) { width: 60%; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.pie { display: flex; align-items: center; gap: 0.8rem; margin-top: 1.4rem; font-size: 1.1rem; color: hsl(220 30% 80%); }
.pie b { color: #fff; font-weight: 600; }
.qr {
  width: 9.5rem; padding: 0.7rem 0.7rem 0.55rem; border-radius: var(--radius-lg); background: #fff;
  color: var(--isdin-navy); text-align: center; box-shadow: 0 1rem 2rem hsl(222 50% 5% / .35);
  transition: opacity .4s ease, transform .6s var(--ease-out-expo);
}
.qr svg { width: 100%; height: auto; display: block; }
.qr span { display: block; font-size: 0.85rem; font-weight: 600; margin-top: 0.35rem; line-height: 1.2; }
.qr.oculto { opacity: 0; transform: translateY(1rem) scale(.95); }
.qr.sin { display: none; }

/* ---------- Cifras ---------- */
.cifras { display: grid; grid-template-columns: repeat(4, 1fr); height: 100%; }
.cifra { padding: 0.9rem 1.5rem; display: flex; flex-direction: column; justify-content: center; }
.cifra + .cifra { border-left: 1px solid var(--border); }
.cifra b { font-family: var(--font-display); font-size: 2.3rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.cifra b.acento { color: var(--primary); }
.cifra span { font-size: 1rem; color: var(--muted-foreground); }

/* ---------- Lista ---------- */
.lista-zona { display: flex; flex-direction: column; }
.zona-cab { display: flex; justify-content: space-between; align-items: baseline; padding: 1.1rem 1.5rem 0.8rem; border-bottom: 1px solid var(--border); }
.zona-cab h2 { font-size: 1.3rem; font-weight: 700; }
.zona-cab span { font-size: 1rem; color: var(--muted-foreground); }
.lista { overflow: hidden; flex: 1; padding: 0.5rem; position: relative; }
.item {
  display: grid; grid-template-columns: 2.4rem 7.5rem 1fr; gap: 1.1rem; align-items: center;
  padding: 0.6rem 0.8rem; border-radius: var(--radius-lg);
  transition: background-color 150ms ease;
}
.item-num { font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; color: var(--muted-foreground); text-align: center; font-variant-numeric: tabular-nums; }
.mini { position: relative; width: 7.5rem; height: 5rem; border-radius: var(--radius); overflow: hidden; background: var(--muted); transition: box-shadow 250ms var(--ease-out-expo), transform 250ms var(--ease-out-expo); }
.mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
.item-meta { font-size: 0.95rem; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-meta b { color: var(--foreground); font-weight: 600; margin-right: 0.5rem; }
.item-titulo { font-size: 1.32rem; line-height: 1.3; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item.hover { background: color-mix(in srgb, var(--primary) 4%, transparent); }
.item.activo { background: var(--primary-soft); }
.item.activo .item-num { color: var(--primary); }
.item.activo .mini { box-shadow: 0 0 0 2px var(--primary); transform: scale(1.04); }
.item.activo .item-titulo { color: var(--primary); font-weight: 700; }

/* ---------- Panel rotativo ---------- */
.panel { position: relative; }
.panel-hoja {
  position: absolute; inset: 0; padding: 1.3rem 1.5rem;
  display: grid; grid-template-columns: 16rem 1fr; gap: 1.5rem; align-items: center;
  opacity: 0; transform: translateY(0.6rem);
  transition: opacity 400ms var(--ease-out-expo), transform 400ms var(--ease-out-expo);
}
.panel-hoja.visible { opacity: 1; transform: none; }
.panel-hoja.columna { grid-template-columns: 1fr; align-items: start; }
.panel-img { position: relative; height: 9.3rem; border-radius: var(--radius); overflow: hidden; background: var(--muted); }
.panel-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.panel-cab { font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; letter-spacing: -0.02em; color: var(--primary); margin-bottom: 0.3rem; }
.panel-nombre { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; }
.panel-datos { font-size: 1.1rem; color: var(--muted-foreground); margin-top: 0.3rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.panel-datos strong { color: var(--foreground); font-weight: 500; }
.trending { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.3rem; }
.trending > div { min-width: 0; }
.trending .panel-img { height: 5.2rem; }
.trending b { display: block; font-size: 1.12rem; font-weight: 600; margin-top: 0.45rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trending span { font-size: 0.98rem; color: var(--muted-foreground); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Ticker ---------- */
.ticker { display: flex; align-items: center; overflow: hidden; background: var(--isdin-navy-deep); color: #fff; font-size: 1.2rem; }
.ticker-etiqueta {
  flex: none; align-self: stretch; display: flex; align-items: center; gap: 0.6rem;
  padding: 0 1.4rem 0 2.5rem; background: var(--primary); font-weight: 700; font-family: var(--font-display); letter-spacing: -0.01em;
}
.ticker-ventana { flex: 1; overflow: hidden; min-width: 0; }
.ticker-pista { display: flex; width: max-content; white-space: nowrap; animation: desplazar linear infinite; }
.ticker-pista span { padding: 0 2.2rem; position: relative; }
.ticker-pista span::after {
  content: ""; position: absolute; right: 0; top: 50%; width: 0.4rem; height: 0.4rem;
  border-radius: 50%; background: var(--primary); transform: translateY(-50%);
}
@keyframes desplazar { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* ---------- Cursor simulado ---------- */
.puntero {
  position: fixed; left: 0; top: 0; width: 2rem; height: 2rem; z-index: 50; pointer-events: none;
  transition: transform 1.1s var(--ease-out-expo);
  filter: drop-shadow(0 0.15rem 0.3rem hsl(220 30% 15% / 0.3));
}
.puntero svg { width: 100%; height: 100%; transition: transform 150ms ease; transform-origin: 10% 10%; }
.puntero.clic svg { transform: scale(.82); }
.onda {
  position: fixed; width: 3rem; height: 3rem; margin: -1.5rem 0 0 -1.5rem; border-radius: 50%;
  border: 2px solid var(--primary); pointer-events: none; z-index: 49;
  animation: onda 600ms var(--ease-out-expo) forwards;
}
@keyframes onda { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.7); opacity: 0; } }

.aviso-ejemplo {
  position: fixed; right: 1.2rem; top: 8rem; z-index: 40; font-size: 0.95rem; font-weight: 600;
  background: var(--warning-soft); color: hsl(38 92% 30%); padding: 0.3rem 0.8rem; border-radius: var(--radius); display: none;
}

@media (prefers-reduced-motion: reduce) {
  .ticker-pista, .esqueleto i, .capa img, .collage img, .directo i::after { animation: none; }
  .capa, .puntero, .palabra > span { transition: none; }
}
</style>
</head>
<body>
<div class="pantalla">
  <header class="cabecera">
    <div class="marca">
      <span id="logo"></span>
      <span class="marca-sep"></span>
      <div>
        <div class="marca-nombre">AI News</div>
        <div class="marca-sub">Novedades de inteligencia artificial</div>
      </div>
    </div>
    <div class="derecha">
      <span class="directo"><i></i>En directo</span>
      <div class="reloj">
        <div class="reloj-hora" id="hora">--:--</div>
        <div class="reloj-fecha" id="fecha"></div>
      </div>
    </div>
  </header>

  <div class="marco">
    <section class="escenario" id="escenario">
      <div class="fondo" id="fondo"></div>
      <div class="velo"></div>
      <div class="escaner" id="escaner"><div class="rejilla"></div><div class="linea"></div></div>
      <div class="historias" id="historias"></div>
      <div class="etiqueta-sup" id="etiquetas"></div>
      <div class="contenido" id="contenido">
        <div>
          <div class="estado" id="estado"></div>
          <h1 class="titulo" id="titulo"></h1>
          <div class="resumen" id="resumen"></div>
          <div class="pie" id="pie"></div>
        </div>
        <div class="qr oculto" id="qr"></div>
      </div>
    </section>
  </div>

  <div class="marco">
    <section class="tarjeta cifras">
      <div class="cifra"><b id="c-noticias">0</b><span>Noticias en pantalla</span></div>
      <div class="cifra"><b id="c-alta" class="acento">0</b><span>De prioridad alta</span></div>
      <div class="cifra"><b id="c-fuentes">0</b><span>Fuentes revisadas</span></div>
      <div class="cifra"><b id="c-hace">--</b><span>Última actualización</span></div>
    </section>
  </div>

  <div class="marco">
    <section class="tarjeta lista-zona">
      <div class="zona-cab"><h2>Todas las noticias</h2><span id="actualizado"></span></div>
      <div class="lista" id="lista"></div>
    </section>
  </div>

  <div class="marco">
    <section class="tarjeta panel" id="panel"></section>
  </div>

  <footer class="ticker">
    <div class="ticker-etiqueta">Última hora</div>
    <div class="ticker-ventana"><div class="ticker-pista" id="ticker"></div></div>
  </footer>
</div>

<div class="puntero" id="puntero" aria-hidden="true">
  <svg viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.6-7.6L21 10.8z" fill="#fff" stroke="#1b2235" stroke-width="1.4" stroke-linejoin="round"/></svg>
</div>
<div class="aviso-ejemplo" id="aviso">Datos de ejemplo</div>

<script>

    { titulo: "Un estudio mide cuánto ayudan los agentes de código en proyectos reales", titular_corto: "Estudio sobre agentes de código", resumen: "El trabajo compara tareas resueltas con y sin agente en repositorios abiertos. Las mejoras se concentran en tareas bien especificadas.", categoria: "Investigación", prioridad: "media", fuente: "arXiv", url: "https://arxiv.org/", publicado: new Date(Date.now() - 19 * 3600000).toISOString(), imagen: null }
  ],
  modelo_open_source: { nombre: "Ejemplo-Coder 8B", tamano: "8B parámetros", licencia: "Apache 2.0", destaca_en: "Autocompletado y explicación de código en varios lenguajes", ejecucion_local: "Funciona con 16 GB de VRAM o en un Mac con 32 GB", url: "https://huggingface.co/" },
  herramienta_del_dia: { nombre: "Agente de terminal", que_hace: "Edita código y ejecuta comandos desde la terminal a partir de instrucciones", diferencia: "Funciona con modelos locales sin enviar código fuera", licencia: "Open source", url: "https://github.com/" },
  trending: [
    { nombre: "org/agente-local", descripcion: "Framework ligero para agentes que usan modelos locales" },
    { nombre: "org/modelo-vision-2b", descripcion: "Modelo de visión pequeño para leer documentos" },
    { nombre: "org/evals-codigo", descripcion: "Conjunto de pruebas para comparar asistentes de código" }
  ]
};

/* ---------- Utilidades ---------- */
const $ = id => document.getElementById(id);
const esperar = ms => new Promise(r => setTimeout(r, ms));
const reducirMovimiento = matchMedia("(prefers-reduced-motion: reduce)").matches;
function el(tag, cls, texto) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (texto != null) e.textContent = texto;
  return e;
}
function hace(iso) {
  if (!iso) return "";
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (isNaN(min) || min < 0) return "";
  if (min < 60) return `hace ${Math.max(min, 1)} min`;
  const h = Math.round(min / 60);
  return h < 24 ? `hace ${h} h` : `hace ${Math.round(h / 24)} d`;
}
const esNuevo = iso => !!iso && (Date.now() - new Date(iso)) < CONFIG.horasNuevo * 3600000;
function dominio(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return ""; } }
function hash(t) { let h = 7; for (const c of String(t)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }

/* ---------- Imágenes y fondos de marca ---------- */
const MANCHAS = ["hsl(12 76% 61% / .55)", "hsl(38 92% 50% / .45)", "hsl(220 70% 55% / .45)", "hsl(330 60% 55% / .35)"];
const MANCHAS_CLARAS = ["hsl(12 76% 61% / .35)", "hsl(38 92% 50% / .30)", "hsl(220 45% 20% / .20)", "hsl(220 60% 70% / .35)"];
function malla(texto, semilla, clara) {
  const v = el("div", "malla" + (clara ? " clara" : "")), h = hash(semilla || texto || "isdin");
  const colores = clara ? MANCHAS_CLARAS : MANCHAS;
  for (let k = 0; k < 3; k++) {
    const m = el("i", "mancha");
    m.style.width = (35 + (h >> (k * 3)) % 30) + "%";
    m.style.left = ((h >> (k * 4)) % 75 - 10) + "%";
    m.style.top = ((h >> (k * 5)) % 70 - 20) + "%";
    m.style.background = colores[(h + k) % colores.length];
    v.appendChild(m);
  }
  if (texto) v.appendChild(el("span", null, texto));
  return v;
}
function imagenEn(cont, src, texto, semilla, clara = true) {
  const pon = () => cont.replaceChildren(malla(texto, semilla, clara));
  cont.replaceChildren();
  if (!src) { pon(); return; }
  const img = el("img"); img.alt = ""; img.onerror = pon; img.src = src;
  cont.appendChild(img);
}

/* ---------- QR ---------- */
function pintarQR(url) {
  const caja = $("qr");
  caja.classList.toggle("sin", !url || typeof qrcode !== "function");
  if (!url || typeof qrcode !== "function") { caja.classList.add("oculto"); return; }
  try {
    const q = qrcode(0, "M"); q.addData(url); q.make();
    const n = q.getModuleCount(); let d = "";
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) d += `M${x} ${y}h1v1h-1z`;
    caja.innerHTML = `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" shape-rendering="crispEdges"><path d="${d}" fill="currentColor"/></svg>`;
    caja.appendChild(el("span", null, "Escanea para leer"));
    caja.classList.remove("oculto");
  } catch { caja.classList.add("oculto"); }
}

/* ---------- Carga de datos ---------- */
function cargarScript() {
  return new Promise(res => {
    window.NOTICIAS = undefined;
    const s = document.createElement("script");
    s.src = CONFIG.jsUrl + "?t=" + Date.now();
    s.onload = () => { res(window.NOTICIAS || null); s.remove(); };
    s.onerror = () => { res(null); s.remove(); };
    document.head.appendChild(s);
  });
}
async function cargar() {
  let d = null;
  try {
    const r = await fetch(CONFIG.jsonUrl + "?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) d = await r.json();
  } catch (e) { /* con file:// fetch falla: probamos noticias.js */ }
  if (!d) d = await cargarScript();
  return d && Array.isArray(d.noticias) ? d : null;
}

/* ---------- Estado ---------- */
let datos = null, firma = "", diapositivas = [], indice = -1, ciclo = 0;
let temporizador = null, temporizadorPanel = null;
const puntero = $("puntero");
let pos = { x: innerWidth * 0.8, y: innerHeight * 0.9 };
function colocarPuntero(x, y) { pos = { x, y }; puntero.style.transform = `translate(${x}px, ${y}px)`; }
colocarPuntero(pos.x, pos.y);

/* ---------- Reloj y logo ---------- */
function reloj() {
  const ahora = new Date();
  $("hora").textContent = ahora.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
  const f = ahora.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
  $("fecha").textContent = f.charAt(0).toUpperCase() + f.slice(1);
  if (datos) $("c-hace").textContent = (hace(datos.generado) || "--").replace("hace ", "");
}
setInterval(reloj, 1000); reloj();
(function () {
  const c = $("logo"), img = el("img"); img.alt = "ISDIN";
  img.onerror = () => { if (img.src !== LOGO_ISDIN) img.src = LOGO_ISDIN; };
  img.src = CONFIG.logo || LOGO_ISDIN; c.appendChild(img);
})();

/* ---------- Cifras animadas ---------- */
function contar(id, valor) {
  const nodo = $(id), inicio = performance.now(), dur = reducirMovimiento ? 0 : 1400;
  const paso = t => {
    const p = dur ? Math.min(1, (t - inicio) / dur) : 1;
    nodo.textContent = Math.round(valor * (1 - Math.pow(1 - p, 4)));
    if (p < 1) requestAnimationFrame(paso);
  };
  requestAnimationFrame(paso);
}

/* ---------- Pintar ---------- */
function pintar(d) {
  datos = d;
  const g = d.generado ? new Date(d.generado) : null;
  $("actualizado").textContent = g && !isNaN(g)
    ? `Actualizado a las ${g.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" })}` : "";

  contar("c-noticias", d.noticias.length);
  contar("c-alta", d.noticias.filter(n => n.prioridad === "alta").length);
  contar("c-fuentes", CONFIG.fuentesRevisadas);
  reloj();

  const lista = $("lista"); lista.replaceChildren();
  d.noticias.forEach((n, i) => {
    const item = el("div", "item");
    const mini = el("div", "mini"); imagenEn(mini, n.imagen, "", n.titulo);
    const cuerpo = el("div"), meta = el("div", "item-meta");
    meta.append(el("b", null, n.fuente || dominio(n.url)),
      document.createTextNode([n.categoria, hace(n.publicado)].filter(Boolean).join(", ")));
    cuerpo.append(meta, el("div", "item-titulo", n.titulo));
    item.append(el("div", "item-num", String(i + 1)), mini, cuerpo);
    lista.appendChild(item);
  });

  const pista = $("ticker"); pista.replaceChildren();
  const titulares = d.noticias.map(n => n.titular_corto || n.titulo);
  [...titulares, ...titulares].forEach(t => pista.appendChild(el("span", null, t)));
  pista.style.animationDuration = Math.max(30, titulares.join(" ").length * 0.22) + "s";

  pintarPanel(d);

  diapositivas = [];
  if (d.destacado && d.destacado.titulo) diapositivas.push({ tipo: "destacado" });
  d.noticias.forEach((_, i) => diapositivas.push({ tipo: "noticia", i }));
  const hist = $("historias"); hist.replaceChildren();
  diapositivas.forEach(() => { const b = el("i"); b.appendChild(el("b")); hist.appendChild(b); });
  indice = -1;
  siguiente();
}

function hoja(imagen, semilla, ...nodos) {
  const h = el("div", "panel-hoja");
  const im = el("div", "panel-img"); imagenEn(im, imagen, "", semilla);
  const tx = el("div"); tx.append(...nodos);
  h.append(im, tx);
  return h;
}
function pintarPanel(d) {
  const panel = $("panel"); panel.replaceChildren();
  clearInterval(temporizadorPanel);
  const hojas = [];
  const m = d.modelo_open_source;
  if (m && m.nombre) {
    const dm = el("div", "panel-datos", [m.tamano, m.licencia, m.destaca_en].filter(Boolean).join(". "));
    if (m.ejecucion_local) { dm.appendChild(el("br")); dm.appendChild(el("strong", null, "En local: " + m.ejecucion_local)); }
    hojas.push(hoja(m.imagen, m.nombre, el("div", "panel-cab", "Modelo open source destacado"), el("div", "panel-nombre", m.nombre), dm));
  }
  const t = d.herramienta_del_dia;
  if (t && t.nombre) {
    const dt = el("div", "panel-datos", t.que_hace || "");
    if (t.diferencia) { dt.appendChild(el("br")); dt.appendChild(el("strong", null, t.diferencia)); }
    hojas.push(hoja(t.imagen, t.nombre, el("div", "panel-cab", "Herramienta de programación del día"),
      el("div", "panel-nombre", t.nombre + (t.licencia ? ` (${t.licencia})` : "")), dt));
  }
  if (Array.isArray(d.trending) && d.trending.length) {
    const h = el("div", "panel-hoja columna"), gr = el("div", "trending");
    d.trending.slice(0, 3).forEach(r => {
      const c = el("div"), im = el("div", "panel-img");
      imagenEn(im, r.imagen, "", r.nombre);
      c.append(im, el("b", null, r.nombre), el("span", null, r.descripcion || ""));
      gr.appendChild(c);
    });
    const env = el("div"); env.append(el("div", "panel-cab", "En tendencia en GitHub y Hugging Face"), gr);
    h.appendChild(env); hojas.push(h);
  }
  hojas.forEach(h => panel.appendChild(h));
  if (!hojas.length) return;
  let k = 0; hojas[0].classList.add("visible");
  if (hojas.length > 1) temporizadorPanel = setInterval(() => {
    hojas[k].classList.remove("visible"); k = (k + 1) % hojas.length; hojas[k].classList.add("visible");
  }, CONFIG.segundosPanel * 1000);
}

/* ---------- Interacción simulada ---------- */
async function moverA(elem, fx = 0.72, fy = 0.5) {
  const r = elem.getBoundingClientRect();
  colocarPuntero(r.left + r.width * fx + (Math.random() * 30 - 15), r.top + r.height * fy + (Math.random() * 8 - 4));
  await esperar(reducirMovimiento ? 50 : 1150);
}
async function clic() {
  puntero.classList.add("clic");
  const o = el("div", "onda"); o.style.left = (pos.x + 4) + "px"; o.style.top = (pos.y + 4) + "px";
  document.body.appendChild(o); setTimeout(() => o.remove(), 700);
  await esperar(150); puntero.classList.remove("clic"); await esperar(150);
}
function desplazarLista(i) {
  const lista = $("lista"), item = lista.children[i];
  if (!item) return;
  lista.scrollTo({ top: Math.max(0, item.offsetTop - lista.clientHeight * 0.3), behavior: reducirMovimiento ? "auto" : "smooth" });
}

async function siguiente() {
  clearTimeout(temporizador);
  const miCiclo = ++ciclo;
  if (!diapositivas.length) return;
  indice = (indice + 1) % diapositivas.length;
  const s = diapositivas[indice];
  const items = [...$("lista").children];

  if (s.tipo === "noticia") {
    desplazarLista(s.i);
    await esperar(500); if (miCiclo !== ciclo) return;
    const item = items[s.i];
    items.forEach(x => x.classList.remove("hover"));
    await moverA(item); if (miCiclo !== ciclo) return;
    item.classList.add("hover");
    await clic(); if (miCiclo !== ciclo) return;
    items.forEach(x => x.classList.remove("activo", "hover"));
    item.classList.add("activo");
  } else {
    items.forEach(x => x.classList.remove("activo", "hover"));
  }
  await mostrar(s, miCiclo);
}

function historias() {
  [...$("historias").children].forEach((b, k) => {
    const barra = b.firstChild;
    b.classList.toggle("hecha", k < indice);
    barra.style.transition = "none"; barra.style.width = "0";
  });
  const actual = $("historias").children[indice];
  if (!actual) return;
  const barra = actual.firstChild, total = CONFIG.segundosPorNoticia * 1000;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    barra.style.transition = `width ${total}ms linear`; barra.style.width = "100%";
  }));
}

function titular(texto) {
  const h = $("titulo");
  h.classList.remove("visible"); h.replaceChildren();
  String(texto || "").split(/\s+/).filter(Boolean).forEach((w, i) => {
    const caja = el("span", "palabra"), dentro = el("span", null, w);
    dentro.style.transitionDelay = (i * 45) + "ms";
    caja.appendChild(dentro);
    h.append(caja, document.createTextNode(" "));
  });
  requestAnimationFrame(() => requestAnimationFrame(() => h.classList.add("visible")));
}

async function mostrar(s, miCiclo) {
  const contenido = $("contenido"), fondo = $("fondo");
  contenido.classList.add("ocultar");
  $("qr").classList.add("oculto");
  await esperar(300); if (miCiclo !== ciclo) return;

  // Nueva imagen con cortinilla
  const capa = el("div", "capa");
  let titulo, resumen, url, origen;
  const etq = $("etiquetas"); etq.replaceChildren();
  const pie = $("pie"); pie.replaceChildren();

  if (s.tipo === "destacado") {
    const conImagen = datos.noticias.filter(n => n.imagen).slice(0, 3);
    if (conImagen.length) {
      const c = el("div", "collage"); c.style.setProperty("--n", conImagen.length);
      conImagen.forEach(n => { const cel = el("div"); imagenEn(cel, n.imagen, "", n.titulo, false); c.appendChild(cel); });
      capa.appendChild(c);
    } else capa.appendChild(malla("Hoy", "hoy", false));
    etq.appendChild(el("span", "chip nuevo", "Lo más importante del día"));
    titulo = datos.destacado.titulo; resumen = datos.destacado.texto; url = ""; origen = `${datos.noticias.length} noticias`;
    pie.append(el("b", null, "Resumen del día"));
  } else {
    const n = datos.noticias[s.i];
    imagenEn(capa, n.imagen, n.categoria || "IA", n.titulo, false);
    if (esNuevo(n.publicado)) etq.appendChild(el("span", "chip nuevo", "Nuevo"));
    if (n.categoria) etq.appendChild(el("span", "chip", n.categoria));
    if (n.confirmado === false) etq.appendChild(el("span", "chip aviso", "Pendiente de confirmar"));
    titulo = n.titulo; resumen = n.resumen; url = n.url; origen = dominio(n.url) || n.fuente || "la fuente";
    pie.append(el("b", null, n.fuente || dominio(n.url)));
    if (hace(n.publicado)) pie.append(el("span", null, hace(n.publicado)));
  }
  fondo.appendChild(capa);
  requestAnimationFrame(() => requestAnimationFrame(() => capa.classList.add("dentro")));
  setTimeout(() => { [...fondo.children].slice(0, -1).forEach(c => c.remove()); }, 1200);

  historias();
  const total = CONFIG.segundosPorNoticia * 1000;
  temporizador = setTimeout(siguiente, total);

  // Fase "IA analizando"
  const estado = $("estado");
  estado.replaceChildren(el("i", "punto"), document.createTextNode(s.tipo === "destacado" ? `Resumiendo ${origen}` : `Analizando ${origen}`));
  const r = $("resumen");
  const esq = el("div", "esqueleto"); esq.append(el("i"), el("i"), el("i")); r.replaceChildren(esq);
  $("titulo").replaceChildren();
  contenido.classList.remove("ocultar");
  const escaner = $("escaner");
  escaner.classList.remove("activo"); void escaner.offsetWidth; escaner.classList.add("activo");
  await esperar(reducirMovimiento ? 200 : 1500); if (miCiclo !== ciclo) return;
  escaner.classList.remove("activo");

  // Titular palabra a palabra, QR y texto escribiéndose
  $("qr").classList.toggle("sin", !url);
  titular(titulo);
  estado.replaceChildren(el("i", "punto"), document.createTextNode(s.tipo === "destacado" ? "Lo más importante del día" : "Resumen generado por IA"));
  setTimeout(() => { if (miCiclo === ciclo) pintarQR(url); }, 600);
  if (!reducirMovimiento) setTimeout(() => { if (miCiclo === ciclo) moverA($("titulo"), 0.8, 0.4); }, 900);
  await esperar(500); if (miCiclo !== ciclo) return;

  r.replaceChildren();
  const txt = document.createTextNode(""), caret = el("span", "caret");
  r.append(txt, caret);
  const texto = resumen || "";
  if (reducirMovimiento) { txt.data = texto; caret.remove(); return; }
  for (let k = 0; k < texto.length; k++) {
    if (miCiclo !== ciclo) return;
    txt.data += texto[k];
    await esperar(/[.,;:]/.test(texto[k]) ? 130 : 22);
  }
  caret.remove();
  if (url && miCiclo === ciclo) { await esperar(800); if (miCiclo === ciclo) moverA($("qr"), 0.5, 0.45); }
}

/* ---------- Arranque y recarga ---------- */
async function actualizar() {
  const d = await cargar();
  const usar = d || datos || EJEMPLO;
  $("aviso").style.display = (!d && !datos) ? "block" : "none";
  const nueva = JSON.stringify(usar);
  if (nueva !== firma) { firma = nueva; pintar(usar); }
}
actualizar();
setInterval(actualizar, CONFIG.minutosRecarga * 60000);
setTimeout(() => location.reload(), 6 * 3600000);
</script>
</body>
</html>
